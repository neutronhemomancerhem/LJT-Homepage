# Site configuration for Junteng Liu's personal homepage (Academic Pages template).
# All personal information is taken from the memory records of Junteng Liu.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &name "Junteng Liu"
description              : &description "Junteng Liu is a first-year PhD candidate at the HKUST NLP Group researching natural language processing and machine learning, with research interests in LLM reasoning and reinforcement learning, hallucination in vision-language models (VLMs), and LLM truthfulness and interpretability."
url                      : https://neutronhemomancerhem.github.io
baseurl                  : "/LJT-Homepage"
repository               : "neutronhemomancerhem/LJT-Homepage"

# Site Author - shown in the sidebar author profile
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Junteng Liu"
  bio              : "First-year PhD candidate at the HKUST NLP Group. Research focuses on natural language processing and machine learning, with research interests in LLM reasoning and reinforcement learning, hallucination in vision-language models (VLMs), and LLM truthfulness and interpretability."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  email            : "jliugi@connect.ust.hk"

  # Academic websites
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

  # Repositories and software development
  github           : "Vicent0205"

  # Social media (X / Twitter: @junteng88716710)
  twitter          : "junteng88716710"

# Publication Category - all publications are listed together on the Publications page
publication_category:

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development

include:
  - .htaccess
  - _pages
  - files

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Social Sharing
twitter:
  username               : &twitter "junteng88716710"

comments:
  provider               :
